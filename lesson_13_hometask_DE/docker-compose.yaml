# docker-compose.yaml
# services: PostgreSQL + pipeline.ipynb
# Pipeline waits for PostgreSQL to be healthy before starting

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-etl_db}
      POSTGRES_USER: ${DB_USER:-etl}
      POSTGRES_PASSWORD: ${DB_PASS:-etl_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Перевіряє чи працює Postgres, 
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-etl} -d ${DB_NAME:-etl_db}" ]
      interval: 3s
      timeout: 3s
      retries: 10

  pipeline:
    build: .
    depends_on:
      postgres:
        condition: service_healthy # чекає поки Postgres пройде healthcheck
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-etl_db}
      DB_USER: ${DB_USER:-etl}
      DB_PASS: ${DB_PASS:-etl_pass}
      DATA_DIR: data/raw
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
